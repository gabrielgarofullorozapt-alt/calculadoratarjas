  <script>const produtos = [
  { nome: "Five Seven", categoria: "PISTOLAS", limpo: 60000, sujo: 81000, limpoParceiro: 55000, sujoParceiro: 74250 },
  { nome: "HK", categoria: "PISTOLAS", limpo: 30000, sujo: 40500, limpoParceiro: 25000, sujoParceiro: 33750 },
  { nome: "Glock Rajada", categoria: "PISTOLAS", limpo: 120000, sujo: 162000, limpoParceiro: 100000, sujoParceiro: 135000 },
  { nome: "G36", categoria: "FUZIS", limpo: 280000, sujo: 378000, limpoParceiro: 260000, sujoParceiro: 351000 },
  { nome: "AK-74", categoria: "FUZIS", limpo: 260000, sujo: 351000, limpoParceiro: 240000, sujoParceiro: 324000 },
  { nome: "SCAR L", categoria: "FUZIS", limpo: 350000, sujo: 472500, limpoParceiro: 300000, sujoParceiro: 405000 },
  { nome: "AK COMPACT", categoria: "FUZIS", limpo: 210000, sujo: 283500, limpoParceiro: 190000, sujoParceiro: 256500 },
  { nome: "MTAR 21", categoria: "SUB METRALHADORAS", limpo: 170000, sujo: 229500, limpoParceiro: 150000, sujoParceiro: 202500 },
  { nome: "Tec-9", categoria: "SUB METRALHADORAS", limpo: 110000, sujo: 148500, limpoParceiro: 90000, sujoParceiro: 121500 },
  { nome: "UZI", categoria: "SUB METRALHADORAS", limpo: 140000, sujo: 189000, limpoParceiro: 120000, sujoParceiro: 162000 },
  { nome: "Thompson", categoria: "SUB METRALHADORAS", limpo: 170000, sujo: 229500, limpoParceiro: 150000, sujoParceiro: 202500 },
  { nome: "DOZE", categoria: "SHOTGUN", limpo: 280000, sujo: 378000, limpoParceiro: 260000, sujoParceiro: 351000 },
  { nome: "Lean", categoria: "DROGAS", limpo: 250, sujo: 338, limpoParceiro: 200, sujoParceiro: 270 },
];

const porcentagemVendedor = 0.10 //10%

let tipoPagamentoSelecionado = "limpo";

const nomesPagamento = {
  limpo: "Limpo",
  sujo: "Sujo",
  limpoParceiro: "Limpo Parceiro",
  sujoParceiro: "Sujo Parceiro"
};

const tbody = document.getElementById('produtos');
// const totalLimpo = document.getElementById('total-limpo');
// const totalSujo = document.getElementById('total-sujo');
// const totalLimpoParceiro = document.getElementById('total-limpo-parceiro');
// const totalSujoParceiro = document.getElementById('total-sujo-parceiro');

// Preencher a tabela com produtos agrupados por categoria
let categoriaAtual = "";

produtos.forEach((produto, index) => {
  if (produto.categoria !== categoriaAtual) {
    categoriaAtual = produto.categoria;

    const categoriaTr = document.createElement('tr');
    categoriaTr.className = 'categoria-linha';
    categoriaTr.innerHTML = `
      <td colspan="6">${produto.categoria}</td>
    `;
    tbody.appendChild(categoriaTr);
  }

  const tr = document.createElement('tr');
  tr.dataset.produtoIndex = index;
  tr.innerHTML = `
    <td>${produto.nome}</td>
    <td class="limpo">R$ ${(produto.limpo * 0).toLocaleString('pt-BR')}</td>
    <td class="sujo">R$ ${(produto.sujo * 0).toLocaleString('pt-BR')}</td>
    <td class="limpo-parceiro">R$ ${(produto.limpoParceiro * 0).toLocaleString('pt-BR')}</td>
    <td class="sujo-parceiro">R$ ${(produto.sujoParceiro * 0).toLocaleString('pt-BR')}</td>
    <td>
      <div class="quantidade-controle">
        <button type="button" onclick="alterarQuantidade(${index}, -1)">−</button>
        <input type="number" min="0" value="0" onchange="atualizaValor(${index}, this.value)">
        <button type="button" onclick="alterarQuantidade(${index}, 1)">+</button>
      </div>
    </td>
  `;
  tbody.appendChild(tr);
});

// Atualizar os valores exibidos em cada linha.
function atualizaValor(index, qtd) {
  const produto = produtos[index];
  const tr = tbody.querySelector(`tr[data-produto-index="${index}"]`);
  const quantidade = Math.max(0, Number(qtd) || 0);

  const limpo = produto.limpo * quantidade;
  const sujo = produto.sujo * quantidade;
  const limpoParceiro = produto.limpoParceiro * quantidade;
  const sujoParceiro = produto.sujoParceiro * quantidade;

  tr.querySelector('.limpo').textContent = `R$ ${limpo.toLocaleString('pt-BR')}`;
  tr.querySelector('.sujo').textContent = `R$ ${sujo.toLocaleString('pt-BR')}`;
  tr.querySelector('.limpo-parceiro').textContent = `R$ ${limpoParceiro.toLocaleString('pt-BR')}`;
  tr.querySelector('.sujo-parceiro').textContent = `R$ ${sujoParceiro.toLocaleString('pt-BR')}`;
}

function formatBrl(value) {
  return value.toLocaleString('pt-BR', {
    style: 'currency',
    currency: 'BRL'
  });
}

// Finaliza o pedido e mostra o total calculado conforme as quantidades.
// Como o seletor de pagamento foi removido, o total principal usa o valor "Limpo".
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[ch]));
}

function finalizarPedido() {
  let total = 0;
  let quantidadeTotal = 0;
  const itens = [];

  produtos.forEach((produto, index) => {
    const linhaProduto = tbody.querySelector(`tr[data-produto-index="${index}"]`);
    const input = linhaProduto.querySelector('input[type="number"]');
    const qtd = Math.max(0, Number(input.value) || 0);

    if (qtd > 0) {
      const preco = Number(produto[tipoPagamentoSelecionado]) || 0;
      const subtotal = preco * qtd;
      total += subtotal;
      quantidadeTotal += qtd;

      itens.push({
        nome: produto.nome,
        quantidade: qtd,
        subtotal: subtotal
      });
    }
  });

  if (quantidadeTotal === 0) {
    alert("Adicione pelo menos um item ao pedido antes de finalizar.");
    document.querySelector("#totais").innerHTML =
      "<p>Nenhum produto foi selecionado.</p>";
    return;
  }

  const comissao = total * porcentagemVendedor;
  const repasse = total - comissao;

  const resumoItens = document.querySelector("#pedido-itens");
  resumoItens.classList.toggle("muitos-itens", itens.length >= 7);

  document.querySelector("#pedido-itens").innerHTML = `
    <div class="resumo-vendedor">
      <div><strong>Vendedor:</strong> ${escapeHtml(dadosVendedor.nome)}</div>
      <div><strong>Passaporte / ID:</strong> ${escapeHtml(dadosVendedor.id)}</div>
    </div>

    ${itens.map(item => `
      <div class="item-pedido">
        <span>${escapeHtml(item.nome)}</span>
        <span class="item-qtd">${item.quantidade}x — ${formatBrl(item.subtotal)}</span>
      </div>
    `).join("")}

    <div class="comissao-box">
      <p><strong>Valor total do pedido:</strong> ${formatBrl(total)}</p>
      <p><strong>Comissão do vendedor (10%):</strong> ${formatBrl(comissao)}</p>
      <p class="destaque"><strong>Valor a repassar:</strong> ${formatBrl(repasse)}</p>
      <p style="font-size:13px;color:#aaa;">
        Chave PIX : <strong> ( 5688 ) GABRIEL CRUZ </strong>
      </p>
    </div>
  `;

  document.querySelector("#pedido-total").innerHTML =
    `Pedido concluído<br><span style="font-size:18px;color:#fff;">Valor total: ${formatBrl(total)}</span>`;

  document.querySelector("#pedido-modal").style.display = "flex";
  document.querySelector("#totais").innerHTML =
    `<p>Valor total do pedido: ${formatBrl(total)}</p>`;
}

function fecharModalPedido() {
  document.querySelector("#pedido-modal").style.display = "none";
}



</script>

    <div class="modal-caixa">
      <h2>Resumo do Pedido</h2>
      <div id="pedido-itens"></div>
      <div class="modal-total" id="pedido-total"></div>
      <button id="fechar-pedido" type="button">Fechar</button>
    </div>
  </div>

<div id="cadastro-modal">
  <div class="cadastro-caixa">
    <h2>Cadastro do Vendedor</h2>
    <p style="color:#fff;">Preencha seus dados antes de iniciar o pedido.</p>
    <div class="cadastro-campo">
      <label for="cadastro-nome">Nome</label>
      <input id="cadastro-nome" type="text" autocomplete="name" placeholder="Nome do vendedor">
    </div>
    <div class="cadastro-campo">
      <label for="cadastro-id">Passaporte / ID</label>
      <input id="cadastro-id" type="text" placeholder="Passaporte ou identificação">
    </div>
    <button id="salvar-cadastro" type="button">Entrar na Calculadora</button>
  </div>
</div>




<script>
let dadosVendedor = { nome: "", id: "" };

const cadastroModal = document.getElementById("cadastro-modal");
const salvarCadastro = document.getElementById("salvar-cadastro");
const nomeCadastro = document.getElementById("cadastro-nome");
const idCadastro = document.getElementById("cadastro-id");

salvarCadastro.addEventListener("click", () => {
  const nome = nomeCadastro.value.trim();
  const id = idCadastro.value.trim();

  if (!nome || !id) {
    alert("Preencha o Nome e o Passaporte / ID.");
    return;
  }

  dadosVendedor = { nome, id };
  cadastroModal.style.display = "none";
});

function alterarQuantidade(index, delta) {
  const linha = tbody.querySelector(`tr[data-produto-index="${index}"]`);
  if (!linha) return;

  const input = linha.querySelector('input[type="number"]');
  const atual = Math.max(0, Number(input.value) || 0);
  const nova = Math.max(0, atual + delta);

  input.value = nova;
  atualizaValor(index, nova);
}

document.getElementById("limpar-itens").addEventListener("click", () => {
  let tinhaItens = false;

  produtos.forEach((produto, index) => {
    const linha = tbody.querySelector(`tr[data-produto-index="${index}"]`);
    const input = linha.querySelector('input[type="number"]');

    if (Number(input.value) > 0) tinhaItens = true;

    input.value = 0;
    atualizaValor(index, 0);
  });

  document.querySelector("#totais").innerHTML =
    tinhaItens
      ? "<p>Todos os itens foram limpos.</p>"
      : "<p>A tabela já estava zerada.</p>";
});

/* Tipo de pagamento */
const botaoPagamento = document.getElementById("tipo-pagamento");
const menuPagamento = document.getElementById("pagamento-menu");

function fecharMenuPagamento() {
  menuPagamento.style.display = "none";
}

botaoPagamento.addEventListener("click", (e) => {
  e.preventDefault();
  e.stopPropagation();

  menuPagamento.style.display =
    menuPagamento.style.display === "block" ? "none" : "block";
});

menuPagamento.querySelectorAll("button[data-pagamento]").forEach((botao) => {
  botao.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();

    const tipo = botao.dataset.pagamento;

    if (!nomesPagamento[tipo]) return;

    tipoPagamentoSelecionado = tipo;
    botaoPagamento.textContent =
      `Pagamento: ${nomesPagamento[tipo]} ▾`;

    fecharMenuPagamento();

    produtos.forEach((produto, index) => {
      const linha = tbody.querySelector(`tr[data-produto-index="${index}"]`);
      if (!linha) return;

      const input = linha.querySelector('input[type="number"]');
      atualizaValor(index, input.value);
    });
  });
});

document.addEventListener("click", (e) => {
  if (!menuPagamento.contains(e.target) && e.target !== botaoPagamento) {
    fecharMenuPagamento();
  }
});

/* Finalizar pedido */
document.getElementById("finalizar-pedido").addEventListener("click", finalizarPedido);

/* Fechar resumo com confirmação */
const pedidoModal = document.getElementById("pedido-modal");
const fecharPedido = document.getElementById("fechar-pedido");

function tentarFecharResumo() {
  const confirmar = confirm("Tem certeza que deseja fechar o resumo do pedido?");

  if (confirmar) {
    pedidoModal.style.display = "none";
  }
}

fecharPedido.addEventListener("click", (e) => {
  e.preventDefault();
  tentarFecharResumo();
});

pedidoModal.addEventListener("click", (e) => {
  if (e.target === pedidoModal) {
    tentarFecharResumo();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && pedidoModal.style.display === "flex") {
    tentarFecharResumo();
  }
});
</script>

</body>
